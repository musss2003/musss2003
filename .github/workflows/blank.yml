name: generate animation

on:
  run-name: Generate Contribution Snake
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: musss2003
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=#38b2ac&color_dots=#161b22,#0e4429,#006d3a,#26a641,#39d353
            
      - name: push github-contribution-grid-snake.svg to the repo
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: main
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
