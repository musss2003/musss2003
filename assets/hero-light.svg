<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Mustafa Sinanović, full-stack developer in Sarajevo. 8,816 commits in the last year."><title>Mustafa Sinanović, full-stack developer in Sarajevo. 8,816 commits in the last year.</title><style>
